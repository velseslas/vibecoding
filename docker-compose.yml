version: '3.8'

services:
  # ========================================
  # PostgreSQL Database
  # ========================================
  postgres:
    image: postgres:16-alpine
    container_name: vibecoding-postgres
    environment:
      POSTGRES_USER: vibecoding
      POSTGRES_PASSWORD: vibecoding_dev_password
      POSTGRES_DB: vibecoding
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibecoding"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vibecoding-network

  # ========================================
  # Redis Cache
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: vibecoding-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vibecoding-network

  # ========================================
  # Optional: pgAdmin (Database Management UI)
  # Access at http://localhost:5050
  # ========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vibecoding-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - vibecoding-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  vibecoding-network:
    driver: bridge
